<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Edge Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f13;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, monospace;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #1a1a22;
      border-bottom: 1px solid #2d2d3a;
      flex-shrink: 0;
    }
    #topbar h1 { font-size: 14px; font-weight: 600; color: #aaa; margin-right: 6px; }
    #topbar label { color: #666; }
    #host-input {
      background: #0f0f13;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
      width: 160px;
    }
    .btn {
      padding: 5px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn-connect  { background: #2a7a4f; color: #fff; }
    .btn-disconnect { background: #7a2a2a; color: #fff; }
    #conn-status {
      margin-left: auto;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 10px;
      font-weight: 600;
    }
    .status-disconnected { background: #3a1a1a; color: #cc5555; }
    .status-connecting   { background: #3a3010; color: #ccaa33; }
    .status-connected    { background: #1a3a1a; color: #44cc66; }

    /* ── Mode controls ── */
    #controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #151519;
      border-bottom: 1px solid #2d2d3a;
      flex-shrink: 0;
    }
    #controls span { color: #666; margin-right: 4px; }
    .btn-mode-servo   { background: #1a4a7a; color: #fff; }
    .btn-mode-inspect { background: #4a3a1a; color: #fff; }
    .btn-mode-idle    { background: #2a2a3a; color: #aaa; }
    .btn-mode-stop    { background: #5a1a1a; color: #fff; }
    .btn-mode-active  { outline: 2px solid #fff; outline-offset: 1px; }
    .btn-status       { background: #1a2a3a; color: #7aafc0; }

    #mode-badge {
      margin-left: 16px;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .badge-idle    { background: #1e1e28; color: #666; }
    .badge-servo   { background: #0e2a4a; color: #5599dd; }
    .badge-inspect { background: #3a2a0e; color: #ddaa44; }

    /* ── Camera grid ── */
    #camera-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 8px;
      flex: 1;
      min-height: 0;
    }

    .cam-panel {
      background: #111116;
      border: 1px solid #2d2d3a;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .cam-panel.active-stream {
      grid-row: 1 / 3;
    }

    .cam-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: #1a1a22;
      border-bottom: 1px solid #2d2d3a;
      flex-shrink: 0;
    }
    .cam-title { font-weight: 600; font-size: 12px; color: #888; }
    .cam-meta  { margin-left: auto; font-size: 11px; color: #555; font-family: monospace; }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }
    .dot.live { background: #44cc66; box-shadow: 0 0 6px #44cc66; }
    .dot.stale { background: #cc9922; }

    .cam-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0d;
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .cam-body img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .cam-placeholder {
      color: #333;
      font-size: 12px;
      text-align: center;
      line-height: 1.8;
    }

    .cam-overlay {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .overlay-chip {
      background: rgba(0,0,0,0.7);
      color: #aaa;
      font-size: 10px;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #333;
    }
    .overlay-chip.highlight { color: #7acc99; border-color: #2a5a3a; }

    /* ── Log panel ── */
    #log-panel {
      background: #0d0d11;
      border-top: 1px solid #2d2d3a;
      flex-shrink: 0;
      height: 90px;
      overflow-y: auto;
      padding: 4px 10px;
    }
    .log-entry {
      font-size: 11px;
      font-family: monospace;
      line-height: 1.5;
      color: #555;
    }
    .log-entry.info  { color: #5588aa; }
    .log-entry.ok    { color: #447755; }
    .log-entry.warn  { color: #997722; }
    .log-entry.error { color: #aa4444; }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <h1>Camera Edge</h1>
  <label>host</label>
  <input id="host-input" type="text" value="localhost">
  <button class="btn btn-connect"     id="btn-connect"    onclick="connectAll()">Connect</button>
  <button class="btn btn-disconnect"  id="btn-disconnect" onclick="disconnectAll()" disabled>Disconnect</button>
  <div id="conn-status" class="status-disconnected">Disconnected</div>
</div>

<!-- Mode controls -->
<div id="controls">
  <span>Mode:</span>
  <button class="btn btn-mode-servo"   id="btn-servo"   onclick="setMode('servo')"   disabled>Servo</button>
  <button class="btn btn-mode-inspect" id="btn-inspect" onclick="setMode('inspect')" disabled>Inspect</button>
  <button class="btn btn-mode-idle"    id="btn-idle"    onclick="setMode('idle')"    disabled>Idle</button>
  <button class="btn btn-mode-stop"    id="btn-stop"    onclick="sendStop()"         disabled>Stop</button>
  <button class="btn btn-status"       id="btn-status"  onclick="sendStatus()"       disabled>Status</button>
  <div id="mode-badge" class="badge-idle">IDLE</div>
</div>

<!-- Camera feeds -->
<div id="camera-grid">

  <!-- Active stream (8766) -->
  <div class="cam-panel active-stream" id="panel-active">
    <div class="cam-header">
      <div class="dot" id="dot-active"></div>
      <span class="cam-title">Active Stream — port 8766</span>
      <span class="cam-meta" id="meta-active">—</span>
    </div>
    <div class="cam-body">
      <div class="cam-placeholder" id="placeholder-active">
        Connect and start a mode<br>to see the active stream
      </div>
      <img id="img-active" alt="" style="display:none">
      <div class="cam-overlay" id="overlay-active"></div>
    </div>
  </div>

  <!-- Wrist raw (8767) -->
  <div class="cam-panel" id="panel-wrist">
    <div class="cam-header">
      <div class="dot" id="dot-wrist"></div>
      <span class="cam-title">Wrist (cam1) — raw</span>
      <span class="cam-meta" id="meta-wrist">—</span>
    </div>
    <div class="cam-body">
      <div class="cam-placeholder" id="placeholder-wrist">Waiting…</div>
      <img id="img-wrist" alt="" style="display:none">
    </div>
  </div>

  <!-- Base raw (8767) -->
  <div class="cam-panel" id="panel-base">
    <div class="cam-header">
      <div class="dot" id="dot-base"></div>
      <span class="cam-title">Base (cam2) — raw</span>
      <span class="cam-meta" id="meta-base">—</span>
    </div>
    <div class="cam-body">
      <div class="cam-placeholder" id="placeholder-base">Waiting…</div>
      <img id="img-base" alt="" style="display:none">
    </div>
  </div>

</div>

<!-- Log -->
<div id="log-panel"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  var wsControl = null;
  var wsStream  = null;
  var wsWrist   = null;
  var wsBase    = null;

  var currentMode   = 'idle';
  var frameCounters = { active: 0, wrist: 0, base: 0 };
  var lastFrameTs   = { active: 0, wrist: 0, base: 0 };

  // ── Logging ────────────────────────────────────────────────────────────────
  function log(msg, cls) {
    var panel = document.getElementById('log-panel');
    var entry = document.createElement('div');
    entry.className = 'log-entry ' + (cls || '');
    var ts = new Date().toLocaleTimeString('en', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    entry.textContent = ts + '  ' + msg;
    panel.appendChild(entry);
    if (panel.children.length > 200) panel.removeChild(panel.firstChild);
    panel.scrollTop = panel.scrollHeight;
  }

  // ── Connect / Disconnect ───────────────────────────────────────────────────
  function getHost() {
    return document.getElementById('host-input').value.trim() || 'localhost';
  }

  function setConnStatus(state) {
    var el = document.getElementById('conn-status');
    el.className = 'status-' + state;
    var labels = { disconnected: 'Disconnected', connecting: 'Connecting…', connected: 'Connected' };
    el.textContent = labels[state] || state;

    var connected = state === 'connected';
    document.getElementById('btn-connect').disabled    = connected;
    document.getElementById('btn-disconnect').disabled = !connected;
    document.getElementById('btn-servo').disabled   = !connected;
    document.getElementById('btn-inspect').disabled = !connected;
    document.getElementById('btn-idle').disabled    = !connected;
    document.getElementById('btn-stop').disabled    = !connected;
    document.getElementById('btn-status').disabled  = !connected;
  }

  function connectAll() {
    var host = getHost();
    setConnStatus('connecting');
    log('Connecting to ' + host + '…', 'info');

    connectControl(host);
    connectStream(host);
    connectRawCam(host, 'wrist');
    connectRawCam(host, 'base');
  }

  function disconnectAll() {
    if (wsControl) { wsControl.close(); wsControl = null; }
    if (wsStream)  { wsStream.close();  wsStream  = null; }
    if (wsWrist)   { wsWrist.close();   wsWrist   = null; }
    if (wsBase)    { wsBase.close();    wsBase    = null; }
    setConnStatus('disconnected');
    setDot('active', false);
    setDot('wrist',  false);
    setDot('base',   false);
    log('Disconnected.', 'warn');
  }

  // ── Control WS (8765) ──────────────────────────────────────────────────────
  function connectControl(host) {
    wsControl = new WebSocket('ws://' + host + ':8765');

    wsControl.onopen = function() {
      log('[ctrl] connected', 'ok');
      setConnStatus('connected');
    };

    wsControl.onmessage = function(evt) {
      try {
        var data = JSON.parse(evt.data);
        if (data.mode !== undefined) {
          applyMode(data.mode);
        }
        if (data.worker_alive !== undefined) {
          log('[ctrl] status → mode=' + data.mode + '  worker_alive=' + data.worker_alive, 'info');
        } else if (data.message) {
          log('[ctrl] ' + data.message, 'info');
        }
        if (!data.ok && data.error) {
          log('[ctrl] error: ' + data.error, 'error');
        }
      } catch(e) {
        log('[ctrl] parse error: ' + e, 'error');
      }
    };

    wsControl.onclose = function() {
      log('[ctrl] closed', 'warn');
      if (wsStream === null && wsWrist === null && wsBase === null) {
        setConnStatus('disconnected');
      }
    };

    wsControl.onerror = function() {
      log('[ctrl] WebSocket error', 'error');
    };
  }

  function sendCmd(obj) {
    if (!wsControl || wsControl.readyState !== WebSocket.OPEN) {
      log('Control socket not open', 'error');
      return;
    }
    wsControl.send(JSON.stringify(obj));
  }

  function setMode(mode) {
    log('[ctrl] → mode ' + mode, 'info');
    sendCmd({ cmd: 'mode', mode: mode });
  }

  function sendStop() {
    log('[ctrl] → stop', 'info');
    sendCmd({ cmd: 'stop' });
  }

  function sendStatus() {
    sendCmd({ cmd: 'status' });
  }

  // ── Active stream WS (8766) ────────────────────────────────────────────────
  function connectStream(host) {
    wsStream = new WebSocket('ws://' + host + ':8766');

    wsStream.onopen = function() {
      log('[stream] connected', 'ok');
    };

    wsStream.onmessage = function(evt) {
      try {
        var data = JSON.parse(evt.data);
        handleStreamFrame(data);
      } catch(e) {
        log('[stream] parse error: ' + e, 'error');
      }
    };

    wsStream.onclose = function() {
      log('[stream] closed', 'warn');
      setDot('active', false);
    };

    wsStream.onerror = function() {
      log('[stream] WebSocket error', 'error');
    };
  }

  function handleStreamFrame(data) {
    var type = data.type || '';

    if (type === 'idle') {
      showPlaceholder('active', 'Mode: idle — ' + (data.message || ''));
      setDot('active', false);
      setMeta('active', 'idle');
      return;
    }

    if (!data.image_jpeg_b64) return;

    frameCounters.active++;
    lastFrameTs.active = Date.now();
    setDot('active', true);

    // display image
    showImage('active', data.image_jpeg_b64);

    // build overlay chips
    var chips = [];

    if (data.fps !== undefined) {
      chips.push({ text: 'FPS ' + data.fps.toFixed(1), hi: true });
    }
    if (data.frame_id !== undefined) {
      chips.push({ text: '#' + data.frame_id });
    }
    if (type === 'servo_frame') {
      var dcount = Array.isArray(data.detections) ? data.detections.length : '?';
      chips.push({ text: 'detections ' + dcount });
      if (data.target_uv) {
        chips.push({ text: 'uv [' + data.target_uv.map(function(v){ return v.toFixed(0); }).join(', ') + ']' });
      }
    }
    if (type === 'inspect_frame') {
      if (Array.isArray(data.wellplates))  chips.push({ text: 'wellplates '  + data.wellplates.length });
      if (Array.isArray(data.apriltags))   chips.push({ text: 'apriltags '   + data.apriltags.length });
      if (data.pc_count !== undefined)     chips.push({ text: 'pts ' + data.pc_count });
    }

    renderOverlay('active', chips);
    setMeta('active', data.mode + '  #' + (data.frame_id || '?'));
  }

  // ── Raw stream WS (8767) ───────────────────────────────────────────────────
  function connectRawCam(host, camera) {
    var ws = new WebSocket('ws://' + host + ':8767');

    ws.onopen = function() {
      log('[raw/' + camera + '] connected, subscribing…', 'ok');
      ws.send(JSON.stringify({ camera: camera }));
    };

    ws.onmessage = function(evt) {
      // handle subscription error
      try {
        var data = JSON.parse(evt.data);
        if (data.ok === false) {
          log('[raw/' + camera + '] ' + (data.error || 'error'), 'error');
          return;
        }
        if (!data.image_jpeg_b64) return;

        frameCounters[camera] = (frameCounters[camera] || 0) + 1;
        lastFrameTs[camera]   = Date.now();
        setDot(camera, true);
        showImage(camera, data.image_jpeg_b64);
        setMeta(camera, '#' + (data.frame_id || '?'));
      } catch(e) {
        log('[raw/' + camera + '] parse error: ' + e, 'error');
      }
    };

    ws.onclose = function() {
      log('[raw/' + camera + '] closed', 'warn');
      setDot(camera, false);
    };

    ws.onerror = function() {
      log('[raw/' + camera + '] error', 'error');
    };

    if (camera === 'wrist') wsWrist = ws;
    else                    wsBase  = ws;
  }

  // ── UI helpers ─────────────────────────────────────────────────────────────
  function showImage(key, b64) {
    var img = document.getElementById('img-' + key);
    var ph  = document.getElementById('placeholder-' + key);
    img.src = 'data:image/jpeg;base64,' + b64;
    img.style.display = 'block';
    if (ph) ph.style.display = 'none';
  }

  function showPlaceholder(key, text) {
    var img = document.getElementById('img-' + key);
    var ph  = document.getElementById('placeholder-' + key);
    if (img) img.style.display = 'none';
    if (ph) { ph.style.display = ''; ph.textContent = text || ''; }
    var ol = document.getElementById('overlay-' + key);
    if (ol) ol.innerHTML = '';
  }

  function setDot(key, live) {
    var dot = document.getElementById('dot-' + key);
    if (!dot) return;
    dot.className = 'dot ' + (live ? 'live' : '');
  }

  function setMeta(key, text) {
    var el = document.getElementById('meta-' + key);
    if (el) el.textContent = text;
  }

  function renderOverlay(key, chips) {
    var ol = document.getElementById('overlay-' + key);
    if (!ol) return;
    ol.innerHTML = chips.map(function(c) {
      return '<span class="overlay-chip' + (c.hi ? ' highlight' : '') + '">' + escHtml(String(c.text)) + '</span>';
    }).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function applyMode(mode) {
    currentMode = mode;
    var badge = document.getElementById('mode-badge');
    badge.textContent = mode.toUpperCase();
    badge.className = 'badge-' + (mode in { servo:1, inspect:1, idle:1 } ? mode : 'idle');

    // highlight active mode button
    ['servo','inspect','idle'].forEach(function(m) {
      var btn = document.getElementById('btn-' + m);
      if (btn) btn.classList.toggle('btn-mode-active', m === mode);
    });

    if (mode === 'idle') {
      showPlaceholder('active', 'Mode: idle');
    }
  }

  // Mark dots stale if no frame received for 3 s
  setInterval(function() {
    var now = Date.now();
    ['active', 'wrist', 'base'].forEach(function(key) {
      if (lastFrameTs[key] && now - lastFrameTs[key] > 3000) {
        setDot(key, false);
      }
    });
  }, 1000);
</script>

</body>
</html>
