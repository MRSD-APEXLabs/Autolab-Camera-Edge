name: Default Config for O-VAD

paths:
  intermdir: ./_interm_out
  outdir: ./_pred_out
  visdir: ./_vis_out
  evaldir: ./_quant_out

datasets:
  custom: # used by quick_run.py / pipeline.py, do not change
    name: custom
    data_dir: ./_custom_dataset
    image_dir: ./_custom_dataset/JPEGImages
    anno_dir: ./_custom_dataset/Annotations
    split_dir: ./splits/custom
    image_format: ""
    anno_format: ""
    fps: 30
  # Add your own dataset below!

entity_seg:
  cropformer:
    project_path: ./thirdparty/detectron2/projects/CropFormer
    config_path: ./thirdparty/detectron2/projects/CropFormer/configs/entityv2/entity_segmentation/cropformer_hornet_3x.yaml
    opts: ['MODEL.WEIGHTS', './_ckpts/CropFormer_hornet_3x_03823a.pth']
    confidence_threshold: 0.5
  sam_automask:
    model_weights: ./_ckpts/sam2.1_hiera_large.pt
    config: configs/sam2.1/sam2.1_hiera_l.yaml
    kwargs:
      points_per_side: 32
      points_per_batch: 64
      pred_iou_thresh: 0.75
      stability_score_thresh: 0.95
      stability_score_offset: 1.0
      mask_threshold: 0.0

tubelet:
  entity_method: cropformer
  tracker:
    name: SAM2.1
    module: SAM2
    model_weights: ./_ckpts/sam2.1_hiera_large.pt
    model_cfg: configs/sam2.1/sam2.1_hiera_l.yaml
    multi_mask: False
  init_entity_thrd: 0.0005   # frac of pixel threshold of an initializing entity
  fill_entity_thrd: 0.0016   # frac of pixel threshold of a filling entity (1/25)^2
  fill_coverage_thrd: 0.25   # add a filling entity only if it is covered by existing entities for < 0.25
  rm_init_entity_thrd: 0.75  # remove an initializing entity if it is covered by prompt mask for > 0.75
  collect_spacing: 30
  roi_filter:                # only track entities near the prompt objects (speeds up tubelets)
    enabled: False
    margin_frac: 0.1         # padding around the prompt objects, as a fraction of image size
    vertical_extend: True    # span the full image height (tools that travel vertically)
    min_overlap: 0.5         # entity must lie at least this much inside the region
  prox_tracker:
    name: SAM2.1
    module: SAM2
    model_weights: ./_ckpts/sam2.1_hiera_large.pt
    model_cfg: configs/sam2.1/sam2.1_hiera_l.yaml
    multi_mask: True

sem_sim:
  name: fcclip
  project_path: ./thirdparty/fc-clip
  config_path: ./thirdparty/fc-clip/configs/coco/panoptic-segmentation/fcclip/fcclip_convnext_large_eval_ade20k.yaml
  opts: ['MODEL.WEIGHTS', './_ckpts/fcclip_cocopan.pth']

methods:
  Ours:
    name: Ours
    module: TubeletGraph
    tubelet_dirname: "tubelets_{}_cropformer_fcclip"
    thrds: 
      mm_cover: 0.3
      clip_sim_max: 0.7
  Ours_abl_prox:  # Ablation without proximity constraint
    name: Ours_abl_prox
    module: TubeletGraph
    tubelet_dirname: "tubelets_{}_cropformer_fcclip"
    thrds: 
      mm_cover: -1.0
      clip_sim_max: 0.7
  Ours_abl_sem:  # Ablation without semantic constraint
    name: Ours_abl_sem
    module: TubeletGraph
    tubelet_dirname: "tubelets_{}_cropformer_fcclip"
    thrds: 
      mm_cover: 0.3
      clip_sim_max: -1.0
  Ours_abl_both:  # Ablation without both constraints
    name: Ours_abl_both
    module: TubeletGraph
    tubelet_dirname: "tubelets_{}_cropformer_fcclip"
    thrds: 
      mm_cover: -1.0
      clip_sim_max: -1.0

vlm:
  # Backbone is chosen on the command line with --vlm, and all three stages use it.
  #   --vlm openai -> the OpenAI API, using openai_model
  #   --vlm qwen   -> the server at base_url; its model name is read from the
  #                   server itself, so there is nothing else to keep in sync.
  # Start a server for the qwen backbone with, e.g.:
  #   vllm serve Qwen/Qwen3-VL-32B-Instruct --port 8000 \
  #       --limit-mm-per-prompt '{"image": 16}'
  openai_model: gpt-5.2
  base_url: http://127.0.0.1:8000/v1
  init_color_rgb: [245, 0, 150]
  init_color_name: pink
  query_color_rgb: [0, 245, 245]
  query_color_name: cyan-blue
  dense_sampling:            # Stage 2: extra VLM samples around each dip into a container
    enabled: False
    interval: 2              # frames between dense samples
    pad_before: 4            # frames before each dip entry/exit
    pad_after: 15            # frames after each exit (when tip contents become visible)
    depth_frac: 0.7          # a dip = bottom edge in the lowest 30% of its travel
    max_gap: 3               # merge dip frames separated by at most this many frames
    min_travel_frac: 0.05    # objects moving less than this (of image height) get no dense frames
  tip_crop:                  # Stage 2: add a zoomed close-up of the tip region to each VLM query
    enabled: False
    width_frac: 0.12         # crop width, as a fraction of image width
    above_frac: 0.30         # extend this far above the object's bottom edge; the tip runs upward from it
    below_frac: 0.30         # and this far below it (the tracked mask often stops at the adapter, above the tip)
    upscale: 2.0

eval:
  obj_id: '0'
  skip_first_frame: True
  temploc_max_pad: 0 # seconds each side